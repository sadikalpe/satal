# Satal — sunucu kurulumu (uygulama + veritabanı + Nginx). Ayrıntı: KURULUM.md
services:
  veritabani:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: satal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında olmalı}
      TZ: Europe/Istanbul
    volumes:
      - vt:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d satal"]
      interval: 10s
      timeout: 5s
      retries: 10

  uygulama:
    build: .
    restart: unless-stopped
    depends_on:
      veritabani:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://satal_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD .env dosyasında olmalı}@veritabani:5432/satal
      MIGRATE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@veritabani:5432/satal
    volumes:
      - yuklemeler:/veri/yuklemeler

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on: [uygulama]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/satal.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

volumes:
  vt:
  yuklemeler:
