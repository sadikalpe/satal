# Satal — Nginx. HTTP'yi HTTPS'e çevirir, uygulamaya aktarır.
server {
  listen 80;
  server_name crm.stagayrimenkul.com.tr;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name crm.stagayrimenkul.com.tr;

  ssl_certificate     /etc/letsencrypt/live/crm.stagayrimenkul.com.tr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/crm.stagayrimenkul.com.tr/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  server_tokens off;
  client_max_body_size 16m;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass http://uygulama:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
